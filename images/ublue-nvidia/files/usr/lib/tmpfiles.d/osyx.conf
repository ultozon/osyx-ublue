# /var is not part of the image on deployed systems; recreate what packages expect.
d /var/lib/iwd 0755 root root - -
d /var/lib/ead 0755 root root - -

# Live thyx SDDM theme config. /usr/share/sddm/themes/thyx/theme.conf links
# here; members of wheel can switch it (flavors does this on theme change).
d /var/lib/osyx 0755 root root - -
C /var/lib/osyx/thyx-theme.conf - - - - /usr/share/sddm/themes/thyx/theme.conf.default
z /var/lib/osyx/thyx-theme.conf 0664 root wheel - -

# Preselect the osyx session at the login screen. SDDM has no default-session
# setting; it uses the last session from state.conf, which it then keeps up to date.
f /var/lib/sddm/state.conf 0644 sddm sddm - [Last]\nSession=/usr/share/wayland-sessions/osyx.desktop\n
