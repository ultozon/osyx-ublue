# osyx installer ISO (bootc-image-builder --type anaconda-iso).
#
# These modules make the matching Anaconda screens available. They do NOT make
# the install interactive on their own: bootc-image-builder still writes an
# unattended osbuild.ks, which build-iso.sh replaces with osyx.ks. Then you
# choose the target disk, create your user (tick "Make this user
# administrator" for sudo), and set language, keyboard and time zone.
#
# The installed system tracks ghcr.io/ultozon/osyx-ublue:latest (set in
# osyx.ks), so `bootc upgrade` works once the image is published there.

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Localization"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
